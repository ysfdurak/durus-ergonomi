# Her gönderimde: derlenmiş sayfalar (index.html, en/index.html) kaynakla aynı mı, çevrilmemiş metin var mı,
# önbelleğe alınan dosyalar değiştiyse sw.js'teki önbellek adı güncellenmiş mi.
name: Kontroller
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Araç bağımlılıkları
        run: cd tools && npm ci --no-audit --no-fund
      - name: Derlenmiş sayfalar kaynakla aynı mı
        run: |
          cd tools && node i18n/extract.mjs && node i18n/build.mjs | tee /tmp/derleme.txt
          grep -q "çevrilmemiş Türkçe metin 0" /tmp/derleme.txt || (echo "İngilizce sayfada çevrilmemiş metin var." && exit 1)
          cd .. && git diff --exit-code -- index.html en/index.html tools/i18n/en.json || (echo "Sayfalar güncel değil: tools klasöründe i18n/extract.mjs ve i18n/build.mjs çalıştırıp gönder." && exit 1)
      - name: Önbellek adı (sw.js) güncel mi
        run: node tools/sw-kontrol.mjs "${{ github.event.before || github.event.pull_request.base.sha }}"
