# Duruş Windows masaüstü sürümünü üretir.
#
# - main'e gönderim, PR ve elle çalıştırma: yalnızca derler, EXE'leri Actions çıktısı (artifact) olarak saklar.
#   Herkese açık Release'e dokunmaz.
# - "v1.5.0" gibi bir etiket gönderilince: etiket desktop/package.json'daki "version" ile aynı olmalı.
#   O sürüm için daha önce Release yoksa yeni Release oluşturulur. Varsa iş durur: yayımlanmış bir sürümün
#   dosyaları asla değiştirilmez (aynı sürüm numarası = aynı dosya).
#
# Yeni sürüm yayımlama: desktop/package.json'da "version"ı artır → main'e gönder, sonra şunlardan biri:
#   a) git tag v1.5.0 && git push origin v1.5.0
#   b) git gerekmez: Actions → "Masaüstü (Windows)" → Run workflow → "surum" kutusuna v1.5.0 yaz.
#      Etiket, Release ile birlikte o anki main commit'ine oluşturulur. Kutu boşsa yalnızca derler.
name: Masaüstü (Windows)
on:
  push:
    branches: [main]
    paths: ['index.html', 'en/**', 'lib/**', 'desktop/**', '.github/workflows/masaustu.yml']
    tags: ['v*']
  pull_request:
    paths: ['index.html', 'en/**', 'lib/**', 'desktop/**', '.github/workflows/masaustu.yml']
  workflow_dispatch:
    inputs:
      surum:
        description: 'Yayımlanacak sürüm (ör. v1.5.0, desktop/package.json ile aynı). Boş bırakılırsa yalnızca derler.'
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: masaustu-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && inputs.surum == '' }}
env:
  # Yayımlanacak etiket: etiket gönderiminde etiketin adı, elle çalıştırmada "surum" kutusu; ikisi de yoksa boş.
  ETIKET: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.surum }}
jobs:
  derle:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    outputs:
      surum: ${{ steps.surum.outputs.v }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Sürüm
        id: surum
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Etiket package.json sürümüyle aynı mı
        if: env.ETIKET != ''
        shell: bash
        env:
          SURUM: ${{ steps.surum.outputs.v }}
        run: |
          if ! [[ "$ETIKET" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Sürüm \"$ETIKET\" geçersiz. v1.5.0 biçiminde yaz."
            exit 1
          fi
          if [ "${ETIKET#v}" != "$SURUM" ]; then
            echo "::error::Etiket ${ETIKET}, desktop/package.json sürümü ${SURUM}. Önce package.json'daki sürümü güncelle, sonra aynı numarayla yayımla."
            exit 1
          fi
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          # main derlemeleri commit'e göre ayrışır; aynı sürüm numarası altında karışmaz.
          name: Durus-Windows-${{ steps.surum.outputs.v }}-${{ github.sha }}
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30

  yayimla:
    needs: derle
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.surum != '' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Bu sürüm daha önce yayımlanmış mı
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$ETIKET" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::$ETIKET zaten yayımlanmış. Yayımlanmış dosyalar değiştirilmez; desktop/package.json'da sürümü artırıp yeni sürüm yayımla."
            exit 1
          fi
          # Elle çalıştırmada etiket henüz olmamalı; varsa başka bir commit'i gösteriyor olabilir.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$ETIKET" >/dev/null 2>&1; then
            echo "::error::$ETIKET etiketi zaten var. Etiketten yayımlamak için etiketi yeniden gönder ya da yeni bir sürüm numarası kullan."
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          name: Durus-Windows-${{ needs.derle.outputs.surum }}-${{ github.sha }}
          path: dist
      - name: SHA-256 özetleri
        run: cd dist && sha256sum *.exe > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release oluştur
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2 — yazma yetkili üçüncü parti eylem, etiket kayarsa diye commit ile sabitlendi
        with:
          tag_name: ${{ env.ETIKET }}
          # Elle çalıştırmada etiket bu commit'e oluşturulur; etiket gönderiminde zaten bu commit'tir.
          target_commitish: ${{ github.sha }}
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/*.exe
            dist/SHA256SUMS.txt
          name: Duruş ${{ env.ETIKET }}
          body: |
            **Duruş — Windows masaüstü sürümü / Windows desktop app**

            - `Durus-…-kurulum.exe`: kurulumlu sürüm (önerilen) / installer (recommended)
            - `Durus-…-tasinabilir.exe`: kurulum gerektirmez / portable, no install
            - `SHA256SUMS.txt`: dosya özetleri; indirdiğin dosyanın bu sürüme ait olduğunu doğrulamak için / checksums to verify your download

            Türkçe ve İngilizce; ilk açılışta dil seçilir, menüden değiştirilebilir. İnternet gerekmez; kayıtlar yalnızca bu bilgisayarda (%APPDATA%\Durus) tutulur.
            Turkish and English; choose at first launch, change from the menu. Works offline; records stay on this computer.

            Uygulama imzasız olduğu için Windows SmartScreen uyarı verebilir: "Ek bilgi → Yine de çalıştır". / The app is unsigned, so SmartScreen may warn: "More info → Run anyway".
