# Duruş Windows masaüstü sürümünü üretir ve GitHub Releases'e koyar.
# - main'e uygulama ya da masaüstü dosyalarında değişiklik gelince: sürüm desktop/package.json'daki "version"dan alınır,
#   "v<sürüm>" etiketli Release oluşturulur ya da (aynı sürümse) dosyaları güncellenir.
# - "v1.2.0" gibi bir etiket gönderilirse: sürüm etiketten alınır.
# - Actions sekmesinden elle de çalıştırılabilir.
name: Masaüstü (Windows)
on:
  push:
    branches: [main]
    paths: ['index.html', 'en/**', 'desktop/**', '.github/workflows/masaustu.yml']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Sürüm numarasını etiketten al
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
      - name: Sürüm
        id: surum
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Durus-Windows
          path: |
            desktop/dist/*.exe
          if-no-files-found: error
      - name: Release'e yükle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.surum.outputs.v }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: desktop/dist/*.exe
          name: Duruş v${{ steps.surum.outputs.v }}
          body: |
            **Duruş — Windows masaüstü sürümü / Windows desktop app**

            - `Durus-…-kurulum.exe`: kurulumlu sürüm (önerilen) / installer (recommended)
            - `Durus-…-tasinabilir.exe`: kurulum gerektirmez / portable, no install

            Türkçe ve İngilizce; ilk açılışta dil seçilir, menüden değiştirilebilir. İnternet gerekmez; kayıtlar yalnızca bu bilgisayarda (%APPDATA%\Durus) tutulur.
            Turkish and English; choose at first launch, change from the menu. Works offline; records stay on this computer.

            Uygulama imzasız olduğu için Windows SmartScreen uyarı verebilir: "Ek bilgi → Yine de çalıştır". / The app is unsigned, so SmartScreen may warn: "More info → Run anyway".
